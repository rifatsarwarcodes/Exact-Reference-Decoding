# Run CPU backends on GitHub-hosted x86-64 and ARM64 Linux runners against the committed
# reference traces (data/ref/). Manual trigger only, to save runner minutes.
name: backends-linux

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "number of prompts (0 = all)"
        default: "0"

env:
  MODEL_REV: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2   # HuggingFaceTB/SmolLM2-135M
  LLAMA_CPP_COMMIT: 620d2225cc436ab0b001e3200e590e3b286ef9ab

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages (pinned)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-ci.txt

      - name: CPU info
        run: |
          lscpu | tee cpuinfo.txt
          python -c "import torch, numpy; print(torch.__config__.show()); numpy.show_config()" | tee -a cpuinfo.txt

      - name: Download model (pinned revision)
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('HuggingFaceTB/SmolLM2-135M', revision='${MODEL_REV}', local_dir='models/SmolLM2-135M', allow_patterns=['*.json','*.safetensors','*.txt'])"

      - name: Build llama.cpp (pinned commit) and driver
        run: |
          git clone https://github.com/ggml-org/llama.cpp third_party/llama.cpp-src
          git -C third_party/llama.cpp-src checkout ${LLAMA_CPP_COMMIT}
          cmake -S third_party/llama.cpp-src -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
                -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF
          cmake --build build -j --target llama
          LIBDIR=$(dirname $(find build -name 'libllama.so' | head -1))
          g++ -std=c++17 -O2 -I third_party/llama.cpp-src/include -I third_party/llama.cpp-src/ggml/include \
              backends/llamacpp_driver.cpp -L $LIBDIR -lllama -Wl,-rpath,$(realpath $LIBDIR) -o llamacpp_driver
          ./llamacpp_driver 2>&1 | head -1 || true

      - name: Convert GGUF (pinned converter)
        run: |
          mkdir -p models/gguf
          for t in f32 bf16 q8_0; do
            python third_party/llama.cpp-src/convert_hf_to_gguf.py models/SmolLM2-135M --outtype $t \
                   --outfile models/gguf/smollm2-135m-$t.gguf
          done
          sha256sum models/gguf/*.gguf | tee gguf.sha256

      - name: Run backends
        run: |
          python scripts/run_backends.py --ref data/ref/smollm2-135m --limit ${{ inputs.limit }} \
                 --driver ./llamacpp_driver \
                 --backends torch-cpu-fp32 torch-cpu-bf16 llamacpp-cpu-f32 llamacpp-cpu-f32-kvf32 \
                            llamacpp-cpu-bf16 llamacpp-cpu-q8_0

      - name: fp64 numpy reference on this CPU
        run: |
          python scripts/make_fp64_ref.py --out results/raw/ref/smollm2-135m/fp64-${{ matrix.runner }} \
                 --limit ${{ inputs.limit }}
          python scripts/compare_refs.py data/ref/smollm2-135m results/raw/ref/smollm2-135m/fp64-${{ matrix.runner }} \
                 | tee -a $GITHUB_STEP_SUMMARY

      - name: Summarise
        run: python scripts/summarize.py results/raw/runs/smollm2-135m/smollm2-135m | tee -a $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.runner }}
          path: |
            results/raw/runs
            cpuinfo.txt
            gguf.sha256
